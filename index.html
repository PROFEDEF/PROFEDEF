<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal de Consulta de Trámites - Clon Fiel</title>
    <style>
        /* Estilos generales */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f6f9;
        }

        /* BARRA SUPERIOR OSCURA */
        .gob-nav {
            background-color: #0c231e; /* Verde/marrón institucional */
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 60px;
            font-size: 13px;
        }

        .gob-nav-left {
            display: flex;
            align-items: center;
            gap: 25px;
        }

        .gob-nav-left img {
            height: 24px; /* Logo Gobierno de México */
        }

        .gob-nav-links {
            display: flex;
            gap: 20px;
        }

        .gob-nav-links a {
            color: #ffffff;
            text-decoration: none;
            opacity: 0.85;
        }

        .gob-nav-right {
            display: flex;
            align-items: center;
            cursor: pointer;
            opacity: 0.85;
        }

        /* Lupa blanca del extremo derecho */
        .icon-lupa {
            width: 12px;
            height: 12px;
            border: 2px solid white;
            border-radius: 50%;
            position: relative;
            display: inline-block;
        }
        .icon-lupa::after {
            content: '';
            position: absolute;
            width: 2px;
            height: 6px;
            background: white;
            bottom: -4px;
            right: -2px;
            transform: rotate(-45deg);
        }

        /* SECCIÓN AZUL PRINCIPAL (HERO) */
        .hero-section {
            background: linear-gradient(180deg, #1f3a52 0%, #2a4d6c 100%);
            color: white;
            text-align: center;
            padding: 40px 20px 80px 20px;
            position: relative;
        }

        /* Menú interno grisáceo/transparente de la foto */
        .sub-menu {
            display: flex;
            justify-content: center;
            gap: 25px;
            margin-bottom: 40px;
            font-size: 14px;
        }

        .sub-menu a {
            color: rgba(255, 255, 255, 0.8);
            text-decoration: none;
            font-weight: 500;
        }

        .sub-menu a:hover {
            color: white;
        }

        .hero-section h1 {
            font-size: 34px;
            margin: 0 0 30px 0;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        /* CONTENEDOR DEL BUSCADOR */
        .search-container {
            display: flex;
            max-width: 650px;
            margin: 0 auto;
            background: white;
            padding: 5px;
            border-radius: 30px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        .search-container input {
            flex: 1;
            border: none;
            padding: 14px 25px;
            font-size: 15px;
            border-radius: 30px;
            outline: none;
            color: #333;
        }

        .search-container button {
            background-color: #7a1c31; /* Color guinda del botón buscar */
            color: white;
            border: none;
            padding: 12px 35px;
            font-size: 15px;
            border-radius: 30px;
            cursor: pointer;
            font-weight: bold;
        }

        /* CONTENEDOR DE LAS 4 TARJETAS BLANCAS */
        .cards-container {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            max-width: 1050px;
            margin: -40px auto 0 auto; /* Empuja las tarjetas hacia arriba de la sección azul */
            padding: 0 20px;
            position: relative;
            z-index: 10;
        }

        /* Tarjeta individual */
        .stat-card {
            background: white;
            border-radius: 4px;
            padding: 25px 15px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            border-bottom: 5px solid #7a1c31; /* Línea guinda inferior */
        }

        .stat-number {
            font-size: 38px;
            font-weight: bold;
            color: #333;
            margin-bottom: 8px;
        }

        .stat-label {
            font-size: 11px;
            color: #666;
            text-transform: uppercase;
            font-weight: bold;
            letter-spacing: 0.3px;
        }

        /* Ajuste para pantallas pequeñas (Celulares) */
        @media (max-width: 768px) {
            .cards-container {
                grid-template-columns: repeat(2, 1fr);
                margin-top: -20px;
            }
            .gob-nav, .sub-menu {
                display: none; /* Esconde menús en pantallas muy chicas para mantener orden */
            }
        }
    </style>
</head>
<body>

    <!-- BARRA SUPERIOR INSTITUCIONAL -->
    <nav class="gob-nav">
        <div class="gob-nav-left">
            <img src="https://diputados.gob.mx" alt="Gobierno de México">
        </div>
        <div class="gob-nav-links">
            <a href="#">Trámites</a>
            <a href="#">Gobierno</a>
        </div>
        <div class="gob-nav-right">
            <span class="icon-lupa"></span>
        </div>
    </nav>

    <!-- SECCIÓN AZUL PRINCIPAL -->
    <div class="hero-section">
        
        <!-- Menú interno de la foto -->
        <div class="sub-menu">
            <a href="#">Inicio</a>
            <a href="#">Trámites</a>
            <a href="#">Gobierno</a>
            <a href="#">Participa</a>
            <a href="#">Datos</a>
        </div>

        <h1>Portal de Consulta de Trámites</h1>
        
        <!-- Buscador con el texto gris de fondo -->
        <div class="search-container">
            <input type="text" placeholder="Escribe el trámite que deseas consultar...">
            <button>Buscar</button>
        </div>
    </div>

    <!-- LAS 4 TARJETAS INFERIORES -->
    <div class="cards-container">
        <div class="stat-card">
            <div class="stat-number">2200</div>
            <div class="stat-label">Visualizadores de datos</div>
        </div>
        <div class="stat-card">
            <div class="stat-number">6285</div>
            <div class="stat-label">Bases de datos</div>
        </div>
        <div class="stat-card">
            <div class="stat-number">184</div>
            <div class="stat-label">Instituciones</div>
        </div>
        <div class="stat-card">
            <div class="stat-number">28</div>
            <div class="stat-label">Categorías</div>
        </div>
    </div>

</body>
</html>
