<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Mi Web con Diseño</title>
    <style>
        /* Aquí empieza el diseño (CSS) */
        body {
            background-color: #f0f4f8; /* Un color de fondo gris azulado suave */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; /* Letra más moderna */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .tarjeta {
            background-color: white;
            padding: 40px;
            border-radius: 15px; /* Bordes redondos */
            box-shadow: 0 4px 15px rgba(0,0,0,0.1); /* Sombra suave */
            text-align: center;
        }
        h1 {
            color: #2b6cb0; /* Texto de color azul bonito */
            margin-bottom: 20px;
        }
        p {
            color: #4a5568; /* Texto gris oscuro */
            font-size: 18px;
        }
    </style>
</head>
<body>

    <!-- El contenido de tu página metido en una tarjeta blanca -->
    <div class="tarjeta">
        <h1>¡Hola Mundo!</h1>
        <p>Estoy aprendiendo a usar Vercel y ya le di diseño a mi página. 🚀</p>
    </div>

</body>
</html>
